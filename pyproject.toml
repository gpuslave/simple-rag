[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "page-rag"
version = "0.1.0"
description = "A local PDF RAG CLI with page-level citations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28,<0.29",
  "langchain-core>=1.2,<2",
  "langchain-openai>=1.1,<2",
  "langchain-qdrant>=1.1,<2",
  "langchain-text-splitters>=1.0,<2",
  "pydantic>=2.11,<3",
  "pymupdf>=1.26,<2",
  "qdrant-client>=1.15,<2",
  "tiktoken>=0.12,<1",
  "typer>=0.16,<1",
]

[project.scripts]
rag = "rag.cli:main"

[dependency-groups]
dev = [
  "mypy>=2.3,<3",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.15,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
addopts = '-q -m "not live"'
markers = [
  "live: requires network access and RouterAI credentials",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
